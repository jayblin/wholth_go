{{define "suggestion"}}
<li>
    <div>
        <a href="/food/{{.Id}}"><h2>{{.Title}}</h2></a>
        <a href="/recipe/{{.Id}}/copy" title="Скопировать"><button>◨</button></a>
    </div>
    <span>Калории: {{.TopNutrient}}</span>

    <span>Готовится: {{.PrepTime}}</span>
    {{end}}
<hr >
</li>
{{end}}
